name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Compile
        run: python -m compileall torrent_transfer.py tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: CLI help
        run: qbt-migrate-instance --help

  live:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Start qBittorrent pair
        run: docker compose -f docker-compose.test.yml up -d
      - name: Live migration
        env:
          QBT_LIVE: "1"
        run: python tests/integration/test_live.py -v
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
