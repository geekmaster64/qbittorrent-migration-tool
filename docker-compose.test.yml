# Two disposable qBittorrent instances for live integration tests.
#   docker compose -f docker-compose.test.yml up -d
#   python tests/integration/test_live.py
#   docker compose -f docker-compose.test.yml down -v
#
# Web UI: admin / adminadmin  on localhost:18080 (source) and :18081 (dest)

services:
  qbt-source:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    ports:
      - "18080:8080"
    volumes:
      - ./tests/integration/source-config:/config
      - source-downloads:/downloads

  qbt-dest:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6882"
    ports:
      - "18081:8080"
    volumes:
      - ./tests/integration/dest-config:/config
      - dest-downloads:/downloads

volumes:
  source-downloads:
  dest-downloads:
