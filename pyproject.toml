[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qbittorrent-migration-tool"
version = "0.3.0"
description = "Migrate torrents, categories, tags, and RSS between qBittorrent instances via the Web API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Brandon Tahedl" }]
keywords = ["qbittorrent", "migration", "torrent", "bittorrent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = ["qbittorrent-api>=2024.9.0"]

[project.urls]
Homepage = "https://github.com/geekmaster64/qbittorrent-migration-tool"
Issues = "https://github.com/geekmaster64/qbittorrent-migration-tool/issues"
Changelog = "https://github.com/geekmaster64/qbittorrent-migration-tool/blob/main/CHANGELOG.md"

[project.scripts]
qbt-migrate-instance = "torrent_transfer:main"

[tool.setuptools]
py-modules = ["torrent_transfer"]
